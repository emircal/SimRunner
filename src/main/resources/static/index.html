<html>
    <head>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.6.0/chart.min.js" integrity="sha512-GMGzUEevhWh8Tc/njS0bDpwgxdCJLQBWG3Z2Ct+JGOpVnEmjvNx6ts4v6A2XJf1HOrtOsfhv3hBKpK9kE5z8AQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    </head>
    <body>
        <div>
            <canvas id="number"></canvas>
        </div>
        <div>
            <canvas id="duration"></canvas>
        </div>
        <div id="breakdown-container" style="display:none">
            <canvas id="breakdown"></canvas>
        </div>
        <div id="message"></div>
        <div>
            <button><a href="/download">Download as CSV</a></button>
        </div>
        <script>
            // colours: reddish, blueish, greenish, yellowish?
            const COLOURS = ["rgb(255, 99, 132)", "rgb(132, 132, 255)", "rgb(132, 255, 132)", "rgb(99, 132, 255)"];
            // duration colours: same but darker
            const DURATION_COLOURS = ["rgb(155,0,32)", "rgb(32,32,150)", "rgb(32,150,32)", "rgb(0,32,150)"];
            // breakdown colours: command time (solid), pool wait (dashed), overhead (dotted)
            const BREAKDOWN_CMD_COLOURS  = ["rgb(220,50,50)",  "rgb(50,50,220)",  "rgb(50,180,50)",  "rgb(180,130,0)"];
            const BREAKDOWN_POOL_COLOURS = ["rgb(255,140,0)",  "rgb(0,180,180)",  "rgb(150,220,80)", "rgb(200,100,200)"];
            const BREAKDOWN_OVH_COLOURS  = ["rgb(160,160,160)","rgb(120,120,200)","rgb(100,180,100)","rgb(180,180,80)"];

            const MAXPOINTS = 1800;

            function loadData(names, label, data, dash) {
                let res = names.map( name => { return {label: name + " (" + label + ")", data: data.map(report => name in report.report ? report.report[name][label] : 0)}});
                for (let i = 0; i < res.length; i++) {
                    res[i].borderColor = COLOURS[i % COLOURS.length];
                    res[i].backgroundColor = dash ? "rgb(132,132,132)" : COLOURS[i % COLOURS.length];
                    if (dash) {
                        res[i].borderDash = [5,5];
                    }
                }

                return res;
            }

            /**
             * Builds datasets for the latency breakdown chart.
             * Returns three series per workload: command time, pool wait, driver overhead.
             * Returns an empty array if breakdown fields are absent from the report.
             */
            function loadBreakdownData(names, data) {
                const firstReport = data[0].report;
                if (!names.some(n => n in firstReport && "mean command time" in firstReport[n])) {
                    return [];
                }
                let res = [];
                names.forEach((name, i) => {
                    res.push({
                        label: `${name} (command time)`,
                        data: data.map(r => name in r.report ? (r.report[name]["mean command time"] || 0) : 0),
                        borderColor: BREAKDOWN_CMD_COLOURS[i % BREAKDOWN_CMD_COLOURS.length],
                        backgroundColor: BREAKDOWN_CMD_COLOURS[i % BREAKDOWN_CMD_COLOURS.length]
                    });
                    res.push({
                        label: `${name} (pool wait)`,
                        data: data.map(r => name in r.report ? (r.report[name]["mean pool wait"] || 0) : 0),
                        borderColor: BREAKDOWN_POOL_COLOURS[i % BREAKDOWN_POOL_COLOURS.length],
                        backgroundColor: BREAKDOWN_POOL_COLOURS[i % BREAKDOWN_POOL_COLOURS.length],
                        borderDash: [6, 4]
                    });
                    res.push({
                        label: `${name} (driver overhead)`,
                        data: data.map(r => name in r.report ? (r.report[name]["mean driver overhead"] || 0) : 0),
                        borderColor: BREAKDOWN_OVH_COLOURS[i % BREAKDOWN_OVH_COLOURS.length],
                        backgroundColor: BREAKDOWN_OVH_COLOURS[i % BREAKDOWN_OVH_COLOURS.length],
                        borderDash: [2, 4]
                    });
                });
                return res;
            }

            function loadPercentileData(names, pnames, data) {
                let res = [];

                names.forEach((name, i) => {
                    pnames.forEach((p, j) => {
                        const entryname = `${name} P${p}`;
                        const values = [];
                        const borderColor = DURATION_COLOURS[i % DURATION_COLOURS.length];
                        const borderDash = [5, 10 * (j+1)];
                        data.forEach(item => {
                            const report = item.report;
                            values.push(report[name].percentiles.filter(entry => entry.p === p)[0].value);
                        });
                        res.push({label: entryname, data: values, borderColor, backgroundColor: "rgb(132,132,132)", borderDash});
                    });
                });

                return res;
            }

            fetch(`http://${window.location.hostname}:${window.location.port}/report`)
                .then(response => response.json())
                .then(data => {
                    if (data.length == 0) {
                        console.log("No data yet");
                        setTimeout(() => {window.location.reload()}, 1000);
                        document.getElementById("message").innerText = "No data yet, please wait...";
                    } else {
                        let firstReport = data[0].report;
                        const dsNames = Object.keys(firstReport);
                        const percentileNames = data[0].report[dsNames[0]].percentiles.map(p => p.p);

                        let labels = data.map( report => report.time );

                        const datasetsNumber = loadData(dsNames, "ops", data, false).concat(loadData(dsNames, "records", data, true));
                        const chartDataNumber = {
                            labels,
                            datasets: datasetsNumber
                        };

                        const datasetsDuration = loadData(dsNames, "mean duration", data, false).concat(loadPercentileData(dsNames, percentileNames, data));
                        const chartDataDuration = {
                            labels,
                            datasets: datasetsDuration
                        };

                        const configNumber = {
                            type: "line",
                            data: chartDataNumber,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: "top"
                                    },
                                    title: {
                                        display: true,
                                        text: "Throughput"
                                    }
                                }
                            }
                        };

                        const configDuration = {
                            type: "line",
                            data: chartDataDuration,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: "top"
                                    },
                                    title: {
                                        display: true,
                                        text: "Latency"
                                    }
                                }
                            }
                        };

                        const numberChart = new Chart(
                            document.getElementById("number"),
                            configNumber
                        );

                        const durationChart = new Chart(
                            document.getElementById("duration"),
                            configDuration
                        );

                        // Latency breakdown chart — only rendered when breakdown fields are present.
                        const datasetsBreakdown = loadBreakdownData(dsNames, data);
                        let breakdownChart = null;
                        if (datasetsBreakdown.length > 0) {
                            document.getElementById("breakdown-container").style.display = "";
                            const configBreakdown = {
                                type: "line",
                                data: { labels, datasets: datasetsBreakdown },
                                options: {
                                    responsive: true,
                                    plugins: {
                                        legend: { position: "top" },
                                        title: {
                                            display: true,
                                            text: "Latency Breakdown (mean ms): command time (net+svr) | pool wait | driver overhead"
                                        }
                                    }
                                }
                            };
                            breakdownChart = new Chart(document.getElementById("breakdown"), configBreakdown);
                        }

                        let last_time = data[data.length - 1].time;

                        const refresh = function() {
                            fetch(`http://${window.location.hostname}:${window.location.port}/report?since=${last_time}`)
                                .then(response => response.json())
                                .then(newdata => {
                                    if (newdata.length > 0) {
                                        last_time = newdata[newdata.length - 1].time;
                                        
                                        newdata.forEach( report => labels.push(report.time));
                                        const updateData = function(i, name, offset, dataset) {
                                            newdata.map( report => dsNames[i] in report.report ? report.report[dsNames[i]][name] : 0).forEach( x => {dataset[i + offset * dsNames.length].data.push(x);});
                                        };
                                        const updatePercentiles = function(i, dataset) {
                                            const name = dsNames[i];
                                            newdata.forEach(item => {
                                                const report = item.report;
                                                if (name in report) {
                                                    percentileNames.forEach(p => {
                                                        dataset.filter(x => x.label === `${name} P${p}`).forEach(x => {
                                                            report[name].percentiles.filter(entry => entry.p === p).forEach(entry => {
                                                                x.data.push(entry.value);
                                                            });
                                                        });
                                                    });
                                                } else {
                                                    percentileNames.forEach(p => {
                                                        dataset.filter(x => x.label === `${name} P${p}`).forEach(x => {
                                                            x.data.push(0);
                                                        });
                                                    });
                                                }
                                            });
                                        };
                                        // Helper to push a single breakdown field for one workload.
                                        const updateBreakdown = function(i, field, seriesOffset) {
                                            if (!breakdownChart) return;
                                            const name = dsNames[i];
                                            // Each workload occupies 3 consecutive series (cmd, pool, overhead).
                                            const dsIdx = i * 3 + seriesOffset;
                                            newdata.map(r => name in r.report ? (r.report[name][field] || 0) : 0)
                                                   .forEach(x => datasetsBreakdown[dsIdx].data.push(x));
                                        };

                                        for (let i = 0; i < dsNames.length; i++) {
                                            updateData(i, "ops", 0, datasetsNumber);
                                            updateData(i, "records", 1, datasetsNumber);
                                            updateData(i, "mean duration", 0, datasetsDuration);
                                            updatePercentiles(i, datasetsDuration);
                                            updateBreakdown(i, "mean command time",   0);
                                            updateBreakdown(i, "mean pool wait",       1);
                                            updateBreakdown(i, "mean driver overhead", 2);
                                        }

                                        if (labels.length > MAXPOINTS) {
                                            let todelete = labels.length - MAXPOINTS;
                                            labels.splice(0, todelete);
                                            for (let i = 0; i < dsNames.length; i++) {
                                                datasetsNumber[i].data.splice(0, todelete);
                                                datasetsNumber[i + dsNames.length].data.splice(0, todelete);

                                                datasetsDuration[i].data.splice(0, todelete);
                                                datasetsDuration[i + dsNames.length].data.splice(0, todelete);

                                                if (breakdownChart) {
                                                    datasetsBreakdown[i * 3 + 0].data.splice(0, todelete);
                                                    datasetsBreakdown[i * 3 + 1].data.splice(0, todelete);
                                                    datasetsBreakdown[i * 3 + 2].data.splice(0, todelete);
                                                }
                                            }
                                        }

                                        numberChart.update("none");
                                        durationChart.update("none");
                                        if (breakdownChart) breakdownChart.update("none");
                                    }
                                });

                            setTimeout(refresh, 1000);
                        };
                        setTimeout(refresh, 1000);
                    }
                });

        </script>
    </body>
</html>
